description: Direct dependencies whose fixes are inside the allowed range; only poetry.lock changes.
manager: poetry
seed:
  requests: 2.31.0
  jinja2: 3.1.2
expected:
  scan:  # must be present; newer advisories may add more
    - {package: requests, installed: 2.31.0, advisory: CVE-2024-35195}
    - {package: jinja2, installed: 3.1.2, advisory: CVE-2024-22195}
  fix:
    exit_code: 0
    changed_files: [poetry.lock]
    results:
      - {package: requests, status: FIXED_AND_VALIDATED, method: lock-upgrade, min_to_version: 2.32.4}
      - {package: jinja2, status: FIXED_AND_VALIDATED, method: lock-upgrade, min_to_version: 3.1.6}
