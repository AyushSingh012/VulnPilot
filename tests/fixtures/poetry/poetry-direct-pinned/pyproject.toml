# Poetry's own table style (no [project] dependencies), to cover ^ / ~ / bare constraints.
[tool.poetry]
name = "fx-poetry-direct-pinned"
version = "0.1.0"
description = "fixture"
authors = ["fixture <fixture@example.invalid>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
