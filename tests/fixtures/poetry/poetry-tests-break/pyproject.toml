[project]
name = "fx-poetry-tests-break"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
    "requests>=2.31,<3",
    "jinja2>=3.1,<4",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
