[project]
name = "vulnpilot"
version = "0.1.0.dev0"
description = "Scan a Python project for vulnerable dependencies, upgrade them, test, rescan and open one PR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "packaging>=24.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tomlkit>=0.13",
    "typer>=0.12",
]

[project.scripts]
vulnpilot = "vulnpilot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = [
    "S603", # subprocess without shell: we always pass argv lists, never shell=True
    "S607", # tools (uv, git, gh, osv-scanner) are found on PATH by design; doctor checks them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
exclude = ["tests/fixtures/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-q"
